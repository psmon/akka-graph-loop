name: release

# git 태그 v* 푸시 → 3개 플랫폼 AOT 빌드 후 npm(@webnori/pdsa) 게시.
# workflow_dispatch 로 수동 실행 시 inputs.publish=true 여야 실제 게시(기본은 dry-run 검증).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 0.0.1)'
        required: true
      publish:
        description: '실제 npm 게시? (true 면 게시, 아니면 dry-run)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.plat }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            plat: win32-x64
          - os: ubuntu-latest
            rid: linux-x64
            plat: linux-x64
          - os: macos-latest
            rid: osx-arm64
            plat: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install AOT prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pdsa version = $V"

      - name: Publish (Native AOT)
        shell: bash
        run: dotnet publish src/pdsa-cli -c Release -r ${{ matrix.rid }} -p:Version=${{ steps.ver.outputs.version }}

      - name: Assemble platform package
        shell: bash
        run: |
          PUBDIR="src/pdsa-cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
          node npm/scripts/assemble.mjs platform "${{ steps.ver.outputs.version }}" "${{ matrix.plat }}" "$PUBDIR"

      - uses: actions/upload-artifact@v6
        with:
          name: pdsa-${{ matrix.plat }}
          path: npm/platform/@webnori/pdsa-${{ matrix.plat }}/
          if-no-files-found: error

  publish:
    name: publish npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: npm/artifacts

      - name: Reassemble package tree
        shell: bash
        run: |
          set -e
          for p in win32-x64 linux-x64 darwin-arm64; do
            dst="npm/platform/@webnori/pdsa-$p"
            mkdir -p "$dst"
            cp -r "npm/artifacts/pdsa-$p/." "$dst/"
          done
          node npm/scripts/assemble.mjs main "${{ steps.ver.outputs.version }}"
          echo "== main package =="; cat npm/pdsa/package.json

      - name: Publish to npm
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for p in win32-x64 linux-x64 darwin-arm64; do
            npm publish "./npm/platform/@webnori/pdsa-$p" --access public
          done
          npm publish ./npm/pdsa --access public

      - name: Dry-run (validation only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
        shell: bash
        run: |
          set -e
          for p in win32-x64 linux-x64 darwin-arm64; do
            npm publish "./npm/platform/@webnori/pdsa-$p" --access public --dry-run
          done
          npm publish ./npm/pdsa --access public --dry-run
