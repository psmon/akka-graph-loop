<text x="52" y="178" fill="#eef2fb" font-size="34" font-weight="700">history 와 show: 루프 자신의 과거를 조회한다</text>
<line x1="52" y1="228" x2="908" y2="228" stroke="#26304a" stroke-width="1"/>
<text x="52" y="268" fill="#3ddc97" font-size="13" font-weight="700" letter-spacing="3">무엇을 배웠나</text>
<text x="52" y="302" fill="#c2ccE4" font-size="19">도그푸딩이 공백을 찾았다. 바로 이 문서를 쓰는 일이 그래프를 손으로 파싱하지 않고는</text>
<text x="52" y="332" fill="#c2ccE4" font-size="19">불가능했고, 그 빠진 조회가 다음 사이클이 됐다.</text>
<text x="52" y="364" fill="#7b8ab8" font-size="15" font-weight="600">테스트 271개</text>
