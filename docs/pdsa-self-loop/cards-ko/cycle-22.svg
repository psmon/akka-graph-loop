<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" width="960" height="398" font-family="Pretendard, Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" role="img" aria-label="PDSA cycle 22: history 와 show: 루프 자신의 과거를 조회한다">
