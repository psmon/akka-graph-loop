<text x="52" y="86" fill="#3ddc97" font-size="17" font-weight="700" letter-spacing="3.5">사이클 22</text>
<text x="52" y="116" fill="#6f7d9c" font-size="15" letter-spacing="1.2">2026-09-02 &#183; 루프가 자신을 감사한다</text>
<rect x="740" y="60" width="168" height="38" rx="19" fill="#0d2b21" stroke="#3ddc97" stroke-opacity="0.55"/>
