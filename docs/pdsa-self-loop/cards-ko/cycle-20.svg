<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" width="960" height="398" font-family="Pretendard, Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" role="img" aria-label="PDSA cycle 20: Akka.NET Streams와 주변 스택 조사">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#141b2d"/><stop offset="100%" stop-color="#0b0f1a"/></linearGradient></defs>
<rect width="960" height="398" rx="22" fill="url(#bg)"/>
<rect width="10" height="398" rx="5" fill="#3ddc97"/>
<text x="52" y="86" fill="#3ddc97" font-size="17" font-weight="700" letter-spacing="3.5">사이클 20</text>
<text x="52" y="116" fill="#6f7d9c" font-size="15" letter-spacing="1.2">2026-09-02 &#183; 루프가 자신을 감사한다</text>
<rect x="740" y="60" width="168" height="38" rx="19" fill="#0d2b21" stroke="#3ddc97" stroke-opacity="0.55"/>
<text x="824" y="85" fill="#3ddc97" font-size="15" font-weight="700" letter-spacing="2.4" text-anchor="middle">충족</text>
<text x="52" y="178" fill="#eef2fb" font-size="34" font-weight="700">Akka.NET Streams와 주변 스택 조사</text>
<line x1="52" y1="228" x2="908" y2="228" stroke="#26304a" stroke-width="1"/>
<text x="52" y="268" fill="#3ddc97" font-size="13" font-weight="700" letter-spacing="3">무엇을 배웠나</text>
<text x="52" y="302" fill="#c2ccE4" font-size="19">간판인 Akka.Streams 루프는 데모만 돌리고 있었고 실제 명령 경로는 순수 동기 코드였다.</text>
<text x="52" y="332" fill="#c2ccE4" font-size="19">그리고 RetryFlow 는 JVM Akka 와 달리 Akka.NET 에 존재하지 않는다.</text>
<text x="52" y="364" fill="#7b8ab8" font-size="15" font-weight="600">후보 20개 판정</text>
<text x="908" y="364" fill="#3ddc97" font-size="15" text-anchor="end">&#8618; #21 이 보강</text>
