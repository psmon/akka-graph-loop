<text x="52" y="268" fill="#f5c451" font-size="13" font-weight="700" letter-spacing="3">WHAT WE LEARNED</text>
<text x="52" y="302" fill="#c2ccE4" font-size="19">Culture-coded resource names (SKILL.en.md) are split into satellite assemblies by</text>
<text x="52" y="332" fill="#c2ccE4" font-size="19">MSBuild. WithCulture=false plus an explicit LogicalName keeps them in the main</text>
<text x="52" y="362" fill="#c2ccE4" font-size="19">assembly.</text>
