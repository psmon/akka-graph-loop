<text x="52" y="268" fill="#3ddc97" font-size="13" font-weight="700" letter-spacing="3">WHAT WE LEARNED</text>
<text x="52" y="302" fill="#c2ccE4" font-size="19">When a cycle's deliverable is a document, the document has to be the expected outcome</text>
