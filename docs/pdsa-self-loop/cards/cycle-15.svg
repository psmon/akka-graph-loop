<rect width="960" height="428" rx="22" fill="url(#bg)"/>
<rect width="10" height="428" rx="5" fill="#f5c451"/>
<text x="52" y="86" fill="#f5c451" font-size="17" font-weight="700" letter-spacing="3.5">CYCLE 15</text>
<text x="52" y="116" fill="#6f7d9c" font-size="15" letter-spacing="1.2">2026-08-27 &#183; REAL-USE DEFECTS</text>
<rect x="740" y="60" width="168" height="38" rx="19" fill="#2e2410" stroke="#f5c451" stroke-opacity="0.55"/>
<text x="824" y="85" fill="#f5c451" font-size="15" font-weight="700" letter-spacing="2.4" text-anchor="middle">PARTIAL</text>
<text x="52" y="178" fill="#eef2fb" font-size="34" font-weight="700">Multi-project: --project on every command</text>
<line x1="52" y1="228" x2="908" y2="228" stroke="#26304a" stroke-width="1"/>
<text x="52" y="268" fill="#f5c451" font-size="13" font-weight="700" letter-spacing="3">WHAT WE LEARNED</text>
<text x="52" y="302" fill="#c2ccE4" font-size="19">Positional() was folding option values into the recorded text,</text>
<text x="52" y="332" fill="#c2ccE4" font-size="19">so the feature was silently broken. A value-option whitelist</text>
<text x="52" y="362" fill="#c2ccE4" font-size="19">fixed plan, do, study and guide at once.</text>
<text x="52" y="394" fill="#7b8ab8" font-size="15" font-weight="600">191 tests</text>
<text x="908" y="394" fill="#f5c451" font-size="15" text-anchor="end">&#8618; reinforces #14</text>
