<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" width="960" height="428" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="PDSA cycle 15: Multi-project: --project on every command">
