<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 442" width="960" height="442" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="PDSA cycle 18: Timeout and spinner for the Claude CLI provider">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#141b2d"/><stop offset="100%" stop-color="#0b0f1a"/></linearGradient></defs>
<rect width="960" height="442" rx="22" fill="url(#bg)"/>
<rect width="10" height="442" rx="5" fill="#3ddc97"/>
<text x="52" y="86" fill="#3ddc97" font-size="17" font-weight="700" letter-spacing="3.5">CYCLE 18</text>
<text x="52" y="116" fill="#6f7d9c" font-size="15" letter-spacing="1.2">2026-08-28 &#183; REAL-USE DEFECTS</text>
<rect x="740" y="60" width="168" height="38" rx="19" fill="#0d2b21" stroke="#3ddc97" stroke-opacity="0.55"/>
<text x="824" y="85" fill="#3ddc97" font-size="15" font-weight="700" letter-spacing="2.4" text-anchor="middle">MET</text>
<text x="52" y="178" fill="#eef2fb" font-size="34" font-weight="700">Timeout and spinner for the Claude CLI</text>
<text x="52" y="222" fill="#eef2fb" font-size="34" font-weight="700">provider</text>
<line x1="52" y1="272" x2="908" y2="272" stroke="#26304a" stroke-width="1"/>
<text x="52" y="312" fill="#3ddc97" font-size="13" font-weight="700" letter-spacing="3">WHAT WE LEARNED</text>
<text x="52" y="346" fill="#c2ccE4" font-size="19">A provider with no timeout can hang forever, and a silent wait</text>
<text x="52" y="376" fill="#c2ccE4" font-size="19">looks like a freeze. Both are UX defects, not cosmetics.</text>
<text x="52" y="408" fill="#7b8ab8" font-size="15" font-weight="600">1,175ms timeout kill verified</text>
</svg>
