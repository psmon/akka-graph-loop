<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="How a pdsa cycle flows: plan sets an expected evaluation, do executes, study is judged by an LLM, act reinforces, and every step is recorded to the graph DB"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6c74"/>
    </marker>
    <marker id="faA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0a020"/>
    </marker>
  </defs>

  <!-- reinforce feedback arrow (Act -> Plan) -->
  <path d="M775 118 C 775 40, 110 40, 110 118" fill="none" stroke="#f0a020" stroke-width="2.4"
        stroke-dasharray="6 5" marker-end="url(#faA)"/>
  <text x="445" y="34" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a86710">REINFORCES  (if verdict ≠ met)</text>

  <!-- step boxes -->
  <g>
    <!-- PLAN -->
    <rect x="30" y="120" width="170" height="92" rx="14" fill="#ffffff" stroke="#1f4e63" stroke-width="2"/>
    <text x="115" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#1f4e63">pdsa plan</text>
    <text x="115" y="174" text-anchor="middle" font-size="11.5" fill="#35474f">sets a verifiable</text>
    <text x="115" y="190" text-anchor="middle" font-size="11.5" fill="#35474f"><tspan font-weight="700">expected</tspan> evaluation</text>

    <!-- DO -->
    <rect x="240" y="120" width="170" height="92" rx="14" fill="#ffffff" stroke="#0e7c8b" stroke-width="2"/>
    <text x="325" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#0e7c8b">pdsa do</text>
    <text x="325" y="174" text-anchor="middle" font-size="11.5" fill="#35474f">organizes Plan → Do</text>
    <text x="325" y="190" text-anchor="middle" font-size="11.5" fill="#35474f">(what you actually did)</text>

    <!-- STUDY -->
    <rect x="450" y="120" width="170" height="92" rx="14" fill="#fdf3e0" stroke="#f0a020" stroke-width="2.4"/>
    <text x="535" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#a86710">pdsa study</text>
    <text x="535" y="172" text-anchor="middle" font-size="11.5" fill="#5a3d00">LLM judges vs expected</text>
    <text x="535" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#5a3d00">met · partial · unmet</text>

    <!-- ACT -->
    <rect x="690" y="120" width="170" height="92" rx="14" fill="#ffffff" stroke="#2a6475" stroke-width="2"/>
    <text x="775" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#2a6475">pdsa act</text>
    <text x="775" y="174" text-anchor="middle" font-size="11.5" fill="#35474f">learnings + next</text>
    <text x="775" y="190" text-anchor="middle" font-size="11.5" fill="#35474f">improvement action</text>
  </g>

  <!-- forward arrows -->
  <g fill="none" stroke="#5a6c74" stroke-width="2.4">
    <line x1="200" y1="166" x2="238" y2="166" marker-end="url(#fa)"/>
    <line x1="410" y1="166" x2="448" y2="166" marker-end="url(#fa)"/>
    <line x1="620" y1="166" x2="688" y2="166" marker-end="url(#fa)"/>
  </g>

  <!-- record lane to graph DB -->
  <g fill="none" stroke="#9fd6de" stroke-width="1.8" stroke-dasharray="3 4">
    <line x1="115" y1="212" x2="115" y2="270"/>
    <line x1="325" y1="212" x2="325" y2="270"/>
    <line x1="535" y1="212" x2="535" y2="270"/>
    <line x1="775" y1="212" x2="775" y2="270"/>
  </g>
  <rect x="30" y="270" width="830" height="46" rx="12" fill="#e8f5f7" stroke="#cfeaf0" stroke-width="1.5"/>
  <text x="445" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#0a6472">
    every step is recorded to the per-project Kùzu graph DB  ·  read back with Cypher  ·  visualized in <tspan font-style="italic">pdsa view</tspan>
  </text>
</svg>
